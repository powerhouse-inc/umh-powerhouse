events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    ##
    # HTTP server with webhook and SAP endpoints
    ##
    server {
        listen 80 default_server;
        server_name _;

        # Add CORS headers globally for this server
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST,GET,PUT,DELETE,HEAD,OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'content-type' always;

        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Stop reason API (update stop reason for a machine stop)
        location /api/v1/stop-reason {
            proxy_pass http://umh-core:8091/api/v1/stop-reason;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cost rates API (part_scrap_costs + line_downtime_costs, read-only)
        location /api/v1/costs {
            proxy_pass http://umh-core:8093/api/v1/costs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stop reasons admin API (CRUD for stop_reasons table)
        location /api/v1/stop-reasons {
            proxy_pass http://umh-core:8092/api/v1/stop-reasons;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook endpoint
        location /webhook/ {
            proxy_pass http://umh-core:8040/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SAP incoming endpoint
        location /sap_in/ {
            proxy_pass http://umh-core:8051/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default location (fallback to 404)
        location / {
            return 404;
        }
    }

    ##
    # Machine Simulator UI (default port 8081, proxied + patched)
    # Upstream bug: the Create Order form sets a JSON Content-Type header but
    # htmx 1.9.10 still sends a form-urlencoded body -> server returns 400.
    # The stock json-enc extension is not enough: it stringifies every value,
    # and this API rejects string-typed planned_qty/priority. So we inject a
    # type-coercing variant. The simulator no longer publishes 8081 itself;
    # nginx owns the host port and proxies to machine-simulator:8081.
    ##
    server {
        listen 8081;
        server_name _;

        location /ws {
            proxy_pass http://machine-simulator:8081/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://machine-simulator:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # sub_filter cannot rewrite a gzipped response
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter '<script src="https://unpkg.com/htmx.org@1.9.10"></script>' '<script src="https://unpkg.com/htmx.org@1.9.10"></script><script>htmx.defineExtension("json-enc-typed",{onEvent:function(n,e){if(n==="htmx:configRequest"){e.detail.headers["Content-Type"]="application/json";}},encodeParameters:function(xhr,parameters,elt){xhr.overrideMimeType("text/json");var numeric=["planned_qty","priority"];var out={};Object.keys(parameters).forEach(function(k){var v=parameters[k];if(numeric.indexOf(k)>=0){var n=parseInt(v,10);if(!isNaN(n)){out[k]=n;}}else if(v!==""){out[k]=v;}});return JSON.stringify(out);}});</script>';
            sub_filter '<form hx-post="/api/orders"' '<form hx-post="/api/orders" hx-ext="json-enc-typed"';
        }
    }

}
