name: "window-frame"
domain: "window"
description: "Window frame fabrication and glazing line"
downtime_cost_per_hour: 300
machines:
  - stage: 1
    type: "profile_cutter"
    role: "Cut PVC or aluminum profiles to measured lengths"
    defaults:
      cycle_time_ms: 375
      scrap_rate: 0.03
      breakdown_probability: 0.020
      auto_restore_time_ms: 750
  - stage: 2
    type: "corner_welder"
    role: "Weld or crimp frame corners to form rectangular frame"
    defaults:
      cycle_time_ms: 500
      scrap_rate: 0.04
      breakdown_probability: 0.025
      auto_restore_time_ms: 1000
  - stage: 3
    type: "glass_setter"
    role: "Insert and seal glass pane into finished frame"
    defaults:
      cycle_time_ms: 625
      scrap_rate: 0.03
      breakdown_probability: 0.020
      auto_restore_time_ms: 875
buffers:
  default_capacity: 6
  overrides: []
recipes:
  - product_id: "WIN-STD-A"
    description: "Standard window - 120x100cm double-glazed"
    cost_per_unit: 45.00
    planned_qty_range: [10, 40]
    overrides:
      1:
        cycle_time_ms: 400
      3:
        cycle_time_ms: 550
  - product_id: "WIN-LRG-B"
    description: "Large panorama window - 240x180cm triple-glazed"
    cost_per_unit: 85.00
    planned_qty_range: [5, 15]
    overrides:
      1:
        cycle_time_ms: 500
      2:
        cycle_time_ms: 700
      3:
        cycle_time_ms: 750
